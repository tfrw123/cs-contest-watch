name: CS Contest Watch - Monitor and Deploy

on:
  schedule:
    # USACO checks run every 30 minutes.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "cs-contest-watch-pages"
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official contest pages
        run: python scripts/monitor.py

      - name: Persist data and change history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contests.json data/monitor-status.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contest monitoring data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
