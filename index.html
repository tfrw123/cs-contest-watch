<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Contest Watch </title>
<style>
:root{--ink:#172743;--muted:#6d7f9d;--line:#e4ebf5;--bg:#f4f7fc;--blue:#3978ed;--green:#159b68;--amber:#d78b18;--pink:#d34d9b;--purple:#8664dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.shell{max-width:1440px;margin:auto;padding:34px 30px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}
h1{font-size:30px;letter-spacing:-.7px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{border:1px solid #d8e2f1;background:white;color:var(--ink);border-radius:11px;padding:11px 15px;font-weight:650;cursor:pointer;text-decoration:none;font-size:13px}
button.primary{background:#1d3154;color:white;border-color:#1d3154}.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin:10px 0 18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 32px #243b6010}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.section-head h2{font-size:17px;margin:0}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.key{display:inline-flex;align-items:center;gap:6px}.swatch{width:9px;height:9px;border-radius:3px;background:var(--blue)}
.timeline-wrap{overflow-x:auto;padding-bottom:6px}.timeline{min-width:900px}.months{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));margin-left:190px;gap:5px}
.month{background:#f0f5fc;border:1px solid #e0e9f6;border-radius:9px;text-align:center;padding:9px 2px;font-size:12px;font-weight:700;color:#526783}
.track{display:grid;grid-template-columns:190px 1fr;min-height:88px;border-bottom:1px solid #edf1f7}.track:last-child{border-bottom:0}.race{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 4px}
.logo{width:42px;height:42px;object-fit:contain;border-radius:9px;background:#fff;flex:none}.race strong{display:block;font-size:14px}.race small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.lane{position:relative;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));align-items:center;background-image:linear-gradient(to right,#edf2f8 1px,transparent 1px);background-size:calc(100% / 11) 100%}
.event{grid-column:var(--start)/var(--end);margin:4px 3px;padding:8px 10px;border-radius:10px;border:1px solid var(--c);background:var(--fill);color:var(--txt);font-size:11px;line-height:1.3;font-weight:700;min-width:0;overflow-wrap:anywhere;position:relative}
.event.deadline{--c:#d99521;--fill:#fff4df;--txt:#85530b}.event.window{--c:#5a94f3;--fill:#e8f1ff;--txt:#244c87}.event.contest{--c:#21a477;--fill:#e4f7ef;--txt:#176548}.event.expected,.event.unknown{--c:#d65c9d;--fill:#fff0f7;--txt:#90416d;border-style:dashed}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.card{border:1px solid var(--line);border-radius:16px;padding:17px;background:#fff;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #1b355014}
.card-top{display:flex;align-items:center;gap:12px}.card-top .logo{width:46px;height:46px}.card h3{font-size:15px;margin:0}.full{font-size:11px;color:var(--muted);margin-top:4px}.pill{margin-left:auto;white-space:nowrap;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:750;background:#eef2f7;color:#62738e}.pill.open{background:#e5f7ef;color:#138256}.pill.closed{background:#fff0e9;color:#b65d28}.pill.running{background:#e8f0ff;color:#2f65c3}
.card-meta{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eff2f7;margin-top:14px;padding-top:12px;font-size:12px;color:var(--muted)}.mode{color:#4d6281;font-size:12px;margin-top:9px}
.history{margin-top:20px}.history-list{display:grid;gap:9px}.history-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:15px;font-size:12px}.history-item a{color:#356dc8}.empty{color:var(--muted);font-size:13px;padding:16px 0}
footer{color:#8795aa;font-size:11px;margin-top:18px;line-height:1.7}
dialog{border:0;border-radius:20px;max-width:720px;width:calc(100% - 28px);padding:0;box-shadow:0 24px 80px #13274344;color:var(--ink)}dialog::backdrop{background:#14233b88}.modal{padding:24px}.modal-head{display:flex;align-items:center;gap:14px}.modal-head .logo{width:56px;height:56px}.modal h2{margin:0;font-size:22px}.modal p{line-height:1.7;color:#526783;font-size:13px}.modal h3{font-size:14px;margin:18px 0 5px}.modal a{color:#346fc7}.close{float:right}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.top{flex-direction:column}}@media(max-width:580px){.shell{padding:22px 14px}.cards{grid-template-columns:1fr}.panel{padding:14px}.months{margin-left:135px}.track{grid-template-columns:135px 1fr}.race{gap:7px}.logo{width:32px;height:32px}.race strong{font-size:12px}}
</style></head><body><main class="shell">
<header class="top"><div><h1>CS Contest Watch </h1><div class="sub">六项计算机竞赛 · 官方赛程追踪 · 自动变更历史</div></div><div class="actions"><button onclick="location.reload()">↻ 刷新数据</button><button class="primary" id="export">导出 Timeline PNG</button></div></header>

<section class="panel"><div class="section-head"><h2>2026–2027 赛季 Timeline</h2><div class="legend"><span class="key"><i class="swatch" style="background:#5a94f3"></i>比赛窗口</span><span class="key"><i class="swatch" style="background:#d99521"></i>报名截止</span><span class="key"><i class="swatch" style="background:#21a477"></i>比赛日</span><span class="key"><i class="swatch" style="background:#d65c9d"></i>待公布</span></div></div><div class="timeline-wrap"><div class="timeline" id="timeline"></div></div></section>
<section class="cards" id="cards"></section>
<section class="panel history"><div class="section-head"><h2>官方页面变更历史</h2><span class="sub">仅记录检测到的变化</span></div><div class="history-list" id="history"></div></section>
<footer>日期仅在官方来源明确公布后显示；TBD 表示尚未公布，不以往年日期推测。页面监测依赖 GitHub Actions 定时运行，实际更新时间以本页记录为准。赛事网页内容变化不一定代表报名或赛程变化，请点击来源核对。</footer>

const MONTHS=["Oct 2026","Nov","Dec","Jan 2027","Feb","Mar","Apr","May","Jun","Jul","Aug"];
const KEYS=["USACO","ACSL","BCC","CCC","AIO","NZIC"];
let DATA=FALLBACK;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateFmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):"TBD";
function status(c){let es=(c.events||[]).filter(e=>e.start);let now=new Date();if(es.some(e=>e.start<=now.toISOString().slice(0,10)&&e.end>=now.toISOString().slice(0,10)&&e.kind!=="deadline"))return ["进行中","running"];let d=es.find(e=>e.kind==="deadline");if(d){let dt=new Date(d.end+"T23:59:59");return dt>=now?["报名/订购截止未到","open"]:["报名/订购已截止","closed"]}return ["待官方公布","neutral"]}
function logo(k){return LOGOS[k]?`<img class="logo" src="${LOGOS[k]}" alt="${k} logo">`:`<div class="logo" style="display:grid;place-items:center;font-weight:800">${k}</div>`}
function monthIndex(date){let d=new Date(date+"T00:00:00");return (d.getFullYear()-2026)*12+d.getMonth()-9}
function render(){
 document.getElementById("update").textContent="最近检查："+(DATA.lastChecked||"尚无自动检查记录");
 document.getElementById("timeline").innerHTML=`<div class="months">${MONTHS.map(m=>`<div class="month">${m}</div>`).join("")}</div>`+KEYS.map(k=>{let c=DATA.contests.find(x=>x.key===k);if(!c)return "";let events=(c.events||[]).map(e=>{let a=e.start?Math.max(0,monthIndex(e.start)):4;let b=e.end?Math.min(12,monthIndex(e.end)+1):12;if(e.month){a=Math.max(0,monthIndex(e.month+"-01"));b=a+1}return `<div class="event ${esc(e.kind)}" style="--start:${a+1};--end:${Math.max(a+1,b)+1}" title="${esc(e.label)}">${esc(e.label)}</div>`}).join("");return `<div class="track"><div class="race">${logo(k)}<div><strong>${k}</strong><small>${esc(c.mode||"报名方式待核实")}</small></div></div><div class="lane">${events}</div></div>`}).join("");
 document.getElementById("cards").innerHTML=KEYS.map(k=>{let c=DATA.contests.find(x=>x.key===k);if(!c)return "";let [label,cl]=status(c);return `<article class="card" data-key="${k}"><div class="card-top">${logo(k)}<div><h3>${k}</h3><div class="full">${esc(c.full)}</div></div><span class="pill ${cl}">${label}</span></div><div class="mode">报名方式：${esc(c.mode||"待官方确认")}</div><div class="card-meta"><span>报名截止：${esc(c.deadline||"TBD")}</span><span>赛季：${esc(c.shortSeason||"TBD")}</span></div></article>`}).join("");
 document.querySelectorAll(".card").forEach(el=>el.onclick=()=>showDetail(el.dataset.key));
 let hist=DATA.history||[];document.getElementById("history").innerHTML=hist.length?hist.slice(0,30).map(h=>`<div class="history-item"><span><b>${esc(h.contest)}</b> · ${esc(h.message||h.type)}</span><span><a href="${esc(h.url||"#")}" target="_blank" rel="noreferrer">官方来源 ↗</a><br>${esc(h.detectedAt||"")}</span></div>`).join(""):`<div class="empty">暂无已记录的官方页面变化。监测任务运行后，变化会显示在这里。</div>`;
}
function showDetail(k){let c=DATA.contests.find(x=>x.key===k);if(!c)return;let fields=[["参赛对象 / 资格",c.eligibility],["比赛轮次与赛制",c.rounds],["组别",c.groups],["难度",c.difficulty],["参赛语言",c.languages],["比赛形式",c.format],["报名说明",c.regText]];document.getElementById("detail-body").innerHTML=`<div class="modal-head">${logo(k)}<div><h2>${k}</h2><div class="sub">${esc(c.full)}</div></div></div>`+fields.map(([h,v])=>`<h3>${h}</h3><p>${esc(v||"官方信息待核实")}</p>`).join("")+`<h3>关键日期</h3><p>${(c.events||[]).map(e=>esc(e.label)).join("<br>")||"TBD"}</p><h3>官方来源</h3><p>${(c.links||[]).map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(t)} ↗</a>`).join("<br>")}</p>`;document.getElementById("detail").showModal()}
async function load(){try{let r=await fetch("./data/contests.json",{cache:"no-store"});if(r.ok)DATA=await r.json()}catch(e){}try{let h=await fetch("./data/history.json",{cache:"no-store"});if(h.ok)DATA.history=await h.json()}catch(e){}render()}

document.getElementById("export").onclick=async()=>{
  const btn=document.getElementById("export");
  const node=document.querySelector(".panel");
  const originalText=btn.textContent;
  let objectUrl=null;

  try{
    if(typeof window.html2canvas!=="function"){
      throw new Error("图片导出组件未加载，请刷新页面后重试。");
    }

    btn.disabled=true;
    btn.textContent="正在生成图片…";

    const exportWidth=Math.max(node.clientWidth,1120);

    const canvas=await window.html2canvas(node,{
      backgroundColor:"#ffffff",
      scale:2,
      useCORS:true,
      allowTaint:false,
      logging:false,
      width:exportWidth,
      windowWidth:exportWidth,
      scrollX:0,
      scrollY:0,
      onclone:(doc)=>{
        const cloned=doc.querySelector(".panel");
        if(cloned){
          cloned.style.width=exportWidth+"px";
          cloned.style.maxWidth="none";
          cloned.style.overflow="visible";
        }

        const wrap=doc.querySelector(".timeline-wrap");
        if(wrap){
          wrap.style.overflow="visible";
          wrap.style.width="100%";
        }
      }
    });

    const blob=await new Promise((resolve,reject)=>{
      canvas.toBlob(value=>{
        if(value) resolve(value);
        else reject(new Error("PNG 图片生成失败"));
      },"image/png");
    });

    objectUrl=URL.createObjectURL(blob);

    const link=document.createElement("a");
    link.href=objectUrl;
    link.download="CS-Contest-Timeline.png";
    document.body.appendChild(link);
    link.click();
    link.remove();

    btn.textContent="图片已生成";

    setTimeout(()=>{
      btn.textContent=originalText;
    },1800);

  }catch(error){
    console.error("PNG export failed:",error);
    alert("导出失败："+error.message);
    btn.textContent=originalText;

  }finally{
    btn.disabled=false;

    if(objectUrl){
      setTimeout(()=>{
        URL.revokeObjectURL(objectUrl);
      },5000);
    }
  }
};

load();
