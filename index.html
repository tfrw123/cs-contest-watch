<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Contest Watch · 2026–2027</title>
<style>
/* Core colors and accessible tones shared by the page and PNG export. */
:root {
  color-scheme: light;
  --yellow: #f4a41d;
  --green: #cce5b0;
  --ink: #000000;
  --gray: #b4b4b5;
  --red: #ff5959;
  --surface: Canvas;
  --bg: color-mix(in srgb, var(--gray) 14%, var(--surface));
  --quiet: color-mix(in srgb, var(--gray) 26%, var(--surface));
  --muted: color-mix(in srgb, var(--ink) 70%, var(--gray));
  --line: var(--gray);
  --grid-line: color-mix(in srgb, var(--gray) 40%, var(--surface));
  --expected-fill: color-mix(in srgb, var(--yellow) 24%, var(--surface));
  --shadow: color-mix(in srgb, var(--ink) 10%, transparent);
  --overlay: color-mix(in srgb, var(--ink) 55%, transparent);
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.shell{max-width:1440px;margin:auto;padding:34px 30px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}
h1{font-size:30px;letter-spacing:-.7px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:11px 15px;font-weight:650;cursor:pointer;text-decoration:none;font-size:13px}
button.primary{background:var(--yellow);color:var(--ink);border-color:var(--ink)}.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin:10px 0 18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 32px var(--shadow)}
.section-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.section-head h2{font-size:17px;margin:0}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.key{display:inline-flex;align-items:center;gap:6px}.swatch{width:9px;height:9px;border-radius:3px;background:var(--fill);border:1px solid var(--c)}
.timeline-wrap{overflow-x:auto;padding-bottom:6px}.timeline{min-width:1240px}.months{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));margin-left:166px;gap:5px}
.month{background:var(--quiet);border:1px solid var(--line);border-radius:9px;text-align:center;padding:9px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.track{display:grid;grid-template-columns:166px minmax(0,1fr);min-height:126px;border-bottom:1px solid var(--grid-line);align-items:stretch}.track:last-child{border-bottom:0}.race{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 10px;text-align:center;min-width:0;overflow:visible}
.logo{width:42px;height:42px;object-fit:contain;border-radius:9px;background:var(--surface);flex:none}.race .logo{width:132px;height:78px;object-fit:contain;object-position:center;background:var(--surface);border-radius:6px;flex:none;transform:none}.race-label{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px}.race strong{display:block;font-size:14px;line-height:1.2;color:var(--ink)}.race small{display:block;color:var(--muted);font-size:11px;margin-top:0;line-height:1.25}
.lane{position:relative;display:grid;min-width:0;grid-template-columns:repeat(11,minmax(0,1fr));align-items:center;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px);background-size:calc(100% / 11) 100%}
.lane{grid-auto-rows:minmax(54px,auto);row-gap:7px;padding:10px 0;align-content:center}.event{grid-column:var(--start)/var(--end);grid-row:auto;margin:0 3px;padding:8px 9px;border-radius:11px;border:1px solid var(--c);background:var(--fill);color:var(--ink);font-size:11px;line-height:1.25;font-weight:700;min-width:0;max-width:calc(100% - 6px);box-sizing:border-box;min-height:54px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;overflow:hidden;position:relative}.event-title{display:block;font-size:11px;line-height:1.25;font-weight:800;overflow-wrap:anywhere;word-break:normal}.event-date{display:block;font-size:10px;line-height:1.25;font-weight:650;overflow-wrap:anywhere;word-break:normal;opacity:.94}
/* Status colors also drive the corresponding legend markers. */
.event.deadline, .swatch.deadline { --c: var(--ink); --fill: var(--yellow) }
.event.window, .event.contest, .swatch.confirmed { --c: var(--ink); --fill: var(--green) }
.event.expected, .swatch.expected { --c: var(--ink); --fill: var(--expected-fill); border-style: dashed }
.event.reference, .swatch.reference { --c: var(--gray); --fill: var(--surface); border-style: dashed; border-width: 2px }
.event.unknown, .swatch.pending { --c: var(--gray); --fill: var(--quiet); border-style: dashed }
.event.error, .swatch.error, .pill.error { --c: var(--ink); --fill: var(--red); background: var(--red) }
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.card{border:1px solid var(--line);border-radius:16px;padding:17px;background:var(--surface);cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px var(--shadow)}
.card-top{display:flex;align-items:center;gap:12px}.card-top .logo{width:46px;height:46px}.card h3{font-size:15px;margin:0}.full{font-size:11px;color:var(--muted);margin-top:4px}.pill{margin-left:auto;white-space:nowrap;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:750;background:var(--quiet);color:var(--ink)}.pill.open{background:var(--yellow);color:var(--ink)}.pill.closed{background:var(--quiet);color:var(--ink)}.pill.running{background:var(--green);color:var(--ink)}
.card-meta{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--grid-line);margin-top:14px;padding-top:12px;font-size:12px;color:var(--muted)}.mode{color:var(--muted);font-size:12px;margin-top:9px}
.history{margin-top:20px}.history-list{display:grid;gap:9px}.history-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:15px;font-size:12px}.history-item a{color:var(--ink)}.empty{color:var(--muted);font-size:13px;padding:16px 0}
footer{color:var(--muted);font-size:11px;margin-top:18px;line-height:1.7}
dialog{border:0;border-radius:20px;max-width:720px;width:calc(100% - 28px);padding:0;box-shadow:0 24px 80px var(--shadow);color:var(--ink)}dialog::backdrop{background:var(--overlay)}.modal{padding:24px}.modal-head{display:flex;align-items:center;gap:14px}.modal-head .logo{width:56px;height:56px}.modal h2{margin:0;font-size:22px}.modal p{line-height:1.7;color:var(--muted);font-size:13px}.modal h3{font-size:14px;margin:18px 0 5px}.modal a{color:var(--ink)}.close{float:right}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.top{flex-direction:column}}@media(max-width:580px){.shell{padding:22px 14px}.cards{grid-template-columns:1fr}.panel{padding:14px}.months{margin-left:150px}.track{grid-template-columns:150px minmax(0,1fr);min-height:116px}.race{gap:6px;padding:10px 6px}.race .logo{width:122px;height:70px}.logo{width:32px;height:32px}.race strong{font-size:12px}.event{font-size:10px;padding:7px 8px}.event-title{font-size:10px}.event-date{font-size:9px}}
/* Shared logo box preserves the original embedded assets and aspect ratios. */
.logo,.race .logo,.card-top .logo,.modal-head .logo{width:112px;height:68px;min-width:112px;max-width:112px;object-fit:contain;object-position:center;transform:none;border-radius:0;background:transparent}
.race{overflow:visible}.card{min-width:0}.card-top{flex-wrap:wrap}.card-top>div{min-width:0;flex:1}.full{overflow-wrap:anywhere}.pill{white-space:normal;max-width:100%}.card-meta{flex-wrap:wrap}.card-meta span{min-width:0;overflow-wrap:anywhere}
.event{overflow:visible;max-width:calc(100% - 6px);height:auto;min-height:64px}.event-title,.event-date{white-space:normal;overflow-wrap:anywhere}.lane{grid-auto-flow:row;grid-auto-rows:minmax(64px,auto);align-items:stretch}
/* The horizontal scroll belongs to the timeline on narrow screens. */
.top { border-block-start: 6px solid var(--yellow); padding-block-start: 18px }
.panel { border-block-start: 3px solid var(--yellow) }
.history { border-block-start-color: var(--green) }
.race { background: var(--bg) }
button:hover, .btn:hover { border-color: var(--ink) }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px }
#lang-toggle { background: var(--green); border-color: var(--ink) }
.history-item { border-inline-start: 3px solid var(--green); flex-wrap: wrap; overflow-wrap: anywhere }
/* Red is reserved for verified problems and important date corrections. */
.health-badge { display: inline-block; max-width: 100%; padding: 4px 9px; border-radius: 8px; color: var(--ink); font-size: 12px; font-weight: 700; overflow-wrap: anywhere }
.health-badge.warning { background: var(--red) }
.health-badge.verified { background: var(--green) }
.health-badge.neutral { background: var(--quiet) }
.monitor-alerts { margin-bottom: 18px; padding: 12px 16px; border: 1px solid var(--line); border-inline-start: 5px solid var(--red); border-radius: 12px; background: var(--surface); overflow-wrap: anywhere }
.monitor-alerts h2, .history-item p { margin: 4px 0 8px }
.monitor-alerts a { color: var(--ink) }
.change-values { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 }
.change-values dt { color: var(--muted); font-weight: 700 }
.change-values dd { margin: 3px 0 0 }
.history-archive { margin-top: 14px }
.history-archive summary { cursor: pointer; font-weight: 700; margin-bottom: 10px }
.history-item a, .modal a { text-decoration-color: var(--yellow); text-underline-offset: 3px }
dialog { background: var(--surface); border-block-start: 4px solid var(--yellow) }
.event-title, .event-date { max-width: 100% }
.modal-head { flex-wrap: wrap }
</style></head><body><main class="shell">
<header class="top"><div><h1>CS Contest Watch</h1><div class="sub" id="subtitle">六项计算机竞赛 · 官方赛程追踪 · 自动变更历史</div></div><div class="actions"><button id="lang-toggle" type="button" aria-label="Switch language">EN</button><button id="refresh" type="button">↻ 刷新数据</button><button class="primary" id="export">导出时间轴 PNG</button></div></header>
<div class="meta"><span class="dot"></span><span id="update">正在读取监测数据…</span><span>·</span><span id="monitor-note">每12小时检查官方来源</span><a id="workflow-status" class="health-badge neutral" href="https://github.com/tfrw123/cs-contest-watch/actions/workflows/monitor-and-deploy.yml" target="_blank" rel="noreferrer">查看 GitHub Actions 状态</a></div>
<section id="monitor-alerts" class="monitor-alerts" aria-live="polite" hidden></section>
<section class="panel"><div class="section-head"><h2 id="timeline-heading">2026–2027 赛季赛事时间表</h2><div class="legend"><span class="key"><i class="swatch confirmed"></i>比赛/答题时间</span><span class="key"><i class="swatch deadline"></i>报名/订购截止</span><span class="key"><i class="swatch confirmed"></i>正式比赛日</span><span class="key"><i class="swatch pending"></i>官方待公布</span><span class="key"><i class="swatch reference"></i><span>去年日期参考</span></span><span class="key"><i class="swatch expected"></i>官网预计</span></div></div><div class="timeline-wrap"><div class="timeline" id="timeline"></div></div></section>
<section class="cards" id="cards"></section>
<section class="panel history"><div class="section-head"><h2 id="history-heading">官方信息更新记录</h2><span class="sub" id="history-sub">仅记录检测到的变化</span></div><div class="history-list" id="history" aria-live="polite"></div><details class="history-archive" id="history-archive" hidden><summary>历史公告</summary><div class="history-list"></div></details></section>
<footer id="footer-note">赛季按当前年份自动滚动；官方尚未公布的新赛季日期以虚线标注为“去年日期参考”，仅供规划，确认后自动以官方日期替换。请以赛事官网及学校通知为准。</footer>
</main><dialog id="detail"><div class="modal"><button class="close" id="detail-close" onclick="document.getElementById('detail').close()">关闭 ✕</button><div id="detail-body"></div></div></dialog>

function changeValue(value) {

}

function renderHistory() {

   estimate_updated: bilingual("官方预计更新", "Official estimate updated"),
  }[item.changeType] || bilingual("赛程更新", "Schedule update");
  const badge = item.changeType === "date_adjusted" ? "warning" : "verified";
  const label = item.event === "nzic-open" ? bilingual("报名预计开放","Expected registration opening") : item.label;

function renderMonitorHealth() {

 status.className = "health-badge " + (failed ? "warning" : succeeded ? "verified" : "neutral");
 status.textContent = failed ? bilingual("GitHub Actions 运行失败", "GitHub Actions failed") :
